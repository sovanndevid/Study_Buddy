<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Countdown | Study Buddy</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/timetable.css"/>
</head>
<body>

  <div data-include="../components/header.html"></div>



  <main class="timer-container">
    <h1>My Timetable</h1>
  
    <table role="grid" aria-readonly="false" tabindex="0" aria-label="Weekly timetable grid">
      <thead>
        <tr role="row">
          <th role="columnheader">Time</th>
          <th role="columnheader">Monday</th>
          <th role="columnheader">Tuesday</th>
          <th role="columnheader">Wednesday</th>
          <th role="columnheader">Thursday</th>
          <th role="columnheader">Friday</th>
        </tr>
      </thead>
      <tbody id="timetable-body">
        <!-- JavaScript will generate this -->
      </tbody>
    </table>
  
    <p style="margin-top: 10px;">Click any cell to edit your schedule. Changes auto-save.</p>
  
    <div style="margin-top: 30px;">
      <button onclick="sendTimetable()">Send Timetable via Email</button>
    </div>
  
    <div style="margin-top: 50px; text-align: left;">
      <h2>Send a Peer Reminder</h2>
      <label for="peerEmail">Peer Email:</label>
      <input type="email" id="peerEmail" placeholder="e.g. friend@email.com" style="width:100%; padding:10px; margin:10px 0;" />
      
      <label for="reminderMessage">Message:</label>
      <textarea id="reminderMessage" rows="4" placeholder="Just a quick reminder to check the group timetable or complete your task!" style="width:100%; padding:10px;"></textarea>
      
      <button onclick="sendReminder()">Send Reminder</button>
    </div>
  </main>
  

  
  <div data-include="../components/footer.html"></div>
  
  <script src="../js/include.js"></script>
  <script src="../js/script.js"></script>
  <script src="../js/timetable.js"></script>
  
</body>
</html>
